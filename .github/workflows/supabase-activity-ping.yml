name: Supabase Activity Ping

on:
  schedule:
    # UTC time: 01:05 / 09:05 / 17:05 (Taipei UTC+8: 09:05 / 17:05 / 01:05)
    - cron: "5 1 * * *"
    - cron: "5 9 * * *"
    - cron: "5 17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping students endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing required secrets: SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          URL="$SUPABASE_URL/rest/v1/students?select=id&limit=1"
          echo "Requesting: $URL"

          status_code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept: application/json" \
            -H "User-Agent: github-actions-supabase-activity-ping" \
            "$URL")

          echo "HTTP status: $status_code"
          echo "Response preview:"
          head -c 500 /tmp/response.txt || true
          echo

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "Ping failed with non-2xx status"
            exit 1
          fi

          echo "Ping success"
