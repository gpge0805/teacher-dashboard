name: Streamlit Keep Warm

"on":
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit and diagnose Streamlit
        shell: python
        env:
          APP_URL: https://teacher-dashboard-qklw6q7r6az3gc8k7paciw.streamlit.app/
        run: |
          import os
          import re
          import time
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              response = page.goto(
                  os.environ["APP_URL"],
                  wait_until="domcontentloaded",
                  timeout=60000,
              )
              print("Initial HTTP status:", response.status if response else "n/a", flush=True)
              reached = False
              deadline = time.monotonic() + 120

              while time.monotonic() < deadline:
                  for frame in page.frames:
                      app = frame.locator('[data-testid="stApp"]')
                      if app.count() and app.first.is_visible():
                          reached = True
                          break
                      wake = frame.get_by_role(
                          "button", name=re.compile("get this app back up", re.I)
                      )
                      if wake.count() and wake.first.is_visible():
                          wake.first.click(timeout=3000)
                          print("Wake button clicked", flush=True)
                  if reached:
                      break
                  page.wait_for_timeout(2000)

              u = urlsplit(page.url)
              print("Final location:", u.scheme + "://" + u.netloc + u.path, flush=True)
              print("Page title:", page.title(), flush=True)
              print("Frame count:", len(page.frames), flush=True)
              if not reached:
                  for i, frame in enumerate(page.frames):
                      try:
                          body = frame.locator("body").inner_text(timeout=3000).lower()
                      except Exception:
                          body = ""
                      indicators = {
                          "sleep": "gone to sleep" in body or "get this app back up" in body,
                          "login": any(s in body for s in ("sign in", "log in", "login", "登入")),
                          "error": any(s in body for s in ("access denied", "something went wrong")),
                      }
                      print("Frame", i, "indicators:", indicators, flush=True)
              browser.close()
              if not reached:
                  raise RuntimeError("Streamlit UI not detected; see diagnostics above")
              print("Streamlit UI reached", flush=True)
